name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check

      - name: Run Type Checker
        run: uv run ty check

      - name: Verify Shell Completion Generation
        run: |
          uv run spritzle completion bash > /dev/null
          uv run spritzle completion zsh > /dev/null
          uv run spritzle completion fish > /dev/null

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (libtorrent-rasterbar)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-libtorrent

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest Suite
        run: uv run pytest
