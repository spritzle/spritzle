[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spritzle"
version = "1.0"
description = ""
authors = [
    { name = "Andrew Resch", email = "andrewresch@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.5",
    "PyJWT>=1.7",
    "click>=7.0",
    "tabulate>=0.8.3",
    "wheel",
    "pyopenssl>=23.2.0",
    "setuptools",
    "libtorrent",
    "ty>=0.0.12",
    "rich>=12.0.0",
]

[project.scripts]
spritzled = "spritzle.daemon.main:main"
spritzle = "spritzle.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["spritzle"]

[dependency-groups]
dev = [
    "pytest",
    "coverage>=4.5",
    "ruff>=0.14.11",
]

[tool.ty.environment]
extra-paths = ["stubs"]
